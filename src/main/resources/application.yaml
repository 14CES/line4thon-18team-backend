spring:
  application:
    name: line4thon_18team

  # 프로젝트 루트의 .env를 읽어옴 (없으면 무시 → 배포 서버에선 실제 환경변수 사용)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 파일 업로드 용량 (기본 1MB라 Takeout zip이 막힘)
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# Google Maps (BE2 장소·경로)
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
  # Google 로그인 (BE1)
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

# 항공편 조회 (BE2 항공권, AeroDataBox - RapidAPI 키)
aerodatabox:
  api-key: ${AERODATABOX_API_KEY:}

# JWT (BE1 로그인)
jwt:
  secret: ${JWT_SECRET:}
  access-token-validity-minutes: 30
  refresh-token-validity-days: 14

# 로컬 개발용: 토큰 없이 X-User-Id 헤더로 사용자 구분 (배포 서버에는 값이 없어서 자동으로 false)
auth:
  dev-header-enabled: ${AUTH_DEV_HEADER_ENABLED:false}

# 요청을 허용할 프론트 주소 (BE1 CORS). 여러 개는 쉼표로
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===== AI (BE3) =====
# OpenAI 키는 .env 의 OPENAI_API_KEY 로 넣는다. CI 에는 키가 없으므로 기본값은 빈 값이고,
# 서버가 시작할 때는 OpenAI 를 호출하지 않는다. (키가 없으면 취향 해석은 기본값으로 진행)
dotlo:
  llm:
    max-attempts: 3
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-5-mini}
      reasoning-effort: ${OPENAI_REASONING_EFFORT:}
      connect-timeout: 5s
      request-timeout: 60s
