name: Deploy

on:
  push:
    branches: [ "main" ]        # main 에 머지되면 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # 커밋 번호 태그도 같이 올려서, 문제가 생기면 이전 커밋 이미지로 바로 되돌릴 수 있게 한다
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/dotlo-backend:latest
            ${{ steps.login-ecr.outputs.registry }}/dotlo-backend:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export PATH=$PATH:/snap/bin
            REGISTRY=${{ steps.login-ecr.outputs.registry }}
            IMAGE=$REGISTRY/dotlo-backend:latest

            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin $REGISTRY

            docker pull $IMAGE

            docker stop dotlo-backend || true
            docker rm dotlo-backend || true

            docker run -d \
              --name dotlo-backend \
              --restart unless-stopped \
              --env-file /home/ubuntu/app.env \
              -p 8080:8080 \
              $IMAGE

            docker image prune -af

            echo "===== Application Logs ====="
            sleep 5
            docker logs --tail 30 dotlo-backend