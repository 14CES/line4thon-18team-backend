name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dotlo
          MYSQL_USER: dotlo
          MYSQL_PASSWORD: dotlo
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # application.yaml 이 읽는 환경변수 (CI 전용 임시 DB라 비밀번호 공개돼도 괜찮음)
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_NAME: dotlo
      DB_USERNAME: dotlo
      DB_PASSWORD: dotlo

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 설정 (캐시)
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew 실행 권한
        run: chmod +x gradlew

      - name: 빌드 + 테스트
        run: ./gradlew build